spring.application.name=clipify

# ===================================================================
# Database Configuration
# ===================================================================
# By default, an embedded in-memory H2 database is enabled for rapid development.
# H2 Console (available at http://localhost:8080/h2-console when enabled):
spring.h2.console.enabled=true

# To switch to your local PostgreSQL database, uncomment the properties below
# and create a database named 'clipify' in PostgreSQL (or update the db name):
# spring.datasource.url=jdbc:postgresql://localhost:5432/clipify
# spring.datasource.username=postgres
# spring.datasource.password=YOUR_POSTGRES_PASSWORD
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
